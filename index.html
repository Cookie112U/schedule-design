<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Расписание НТТЭК</title>
    <link rel="icon" type="image/png" href="Img/logo_small.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Merriweather:300,400,700&amp;subset=cyrillic&amp;display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Raleway:400,500,600,700&amp;subset=cyrillic&amp;display=swap" />
    <script>
      // Применяем сохранённые настройки до первой отрисовки, чтобы не было вспышки светлой темы.
      (function () {
        try {
          var s = JSON.parse(localStorage.getItem("nttek-schedule-ui-v2") || "{}");
          var r = document.documentElement;
          var dark = s.theme ? s.theme === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
          r.classList.toggle("dark", dark);
          if (s.size) r.dataset.size = s.size;
          if (s.width) r.dataset.width = s.width;
          if (/^#[0-9a-f]{6}$/i.test(s.accent || "")) r.style.setProperty("--user-accent", s.accent);
        } catch (e) {}
      })();
    </script>
    <link rel="stylesheet" href="css/app.css" />
    <link rel="stylesheet" href="css/holidays/new-year.css" />
    <link rel="stylesheet" href="css/holidays/russia-day.css" />
    <link rel="stylesheet" href="css/holidays/easter.css" />
    <link rel="stylesheet" href="css/holidays/september.css" />
    <link rel="stylesheet" href="css/holidays/march-8.css" />
    <link rel="stylesheet" href="css/holidays/february-23.css" />
    <link rel="stylesheet" href="css/holidays/victory-day.css" />
    <link rel="stylesheet" href="css/holidays/holiday-numbers.css" />
    <link rel="stylesheet" href="css/holidays/holiday-buttons.css" />
  </head>
  <body>
    <div class="app relative min-h-screen overflow-x-clip" data-theme="light" data-size="medium" data-width="standard">
      <div class="holiday-layer" aria-hidden="true">
        <canvas class="holiday-particles" id="holidayParticles"></canvas>
        <div class="garland"></div>
        <div class="snowfall"></div>
        <div class="flag-wave"></div>
        <div class="holiday-ribbon"></div>
        <div class="holiday-number">
          <span class="number-halo"></span>
          <span class="number-decor number-decor-1"></span>
          <span class="number-decor number-decor-2"></span>
          <span class="number-decor number-decor-3"></span>
          <span class="number-decor number-decor-4"></span>
        </div>
      </div>
      <button class="admin-holiday-button" type="button" id="holidayAdminButton" aria-label="Тест праздничного оформления"></button>

      <header class="app-header sticky top-0 z-30 border-b bg-background/90 backdrop-blur">
        <div class="mx-auto flex w-full max-w-(--content-max) items-center justify-between gap-3 px-4 py-3 md:px-8">
          <a class="brand flex min-w-0 items-center gap-3 text-foreground" href="#" title="Расписание НТТЭК" aria-label="Главная страница расписания">
            <img class="logo size-9 shrink-0 object-contain" src="Img/Logo_Nttek.svg" alt="НТТЭК" />
            <strong class="font-display text-sm leading-tight font-normal sm:text-base">Расписание<br class="sm:hidden" /> ГАПОУ СО НТТЭК</strong>
          </a>

          <div class="header-actions flex shrink-0 gap-2" aria-label="Быстрые действия">
            <button class="icon-button" type="button" id="roomsButton" title="Занятость аудиторий" aria-label="Занятость аудиторий">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M13 4h3a2 2 0 0 1 2 2v14" />
                <path d="M2 20h3" />
                <path d="M13 20h9" />
                <path d="M10 12v.01" />
                <path d="M13 4.562v16.157a1 1 0 0 1-1.242.97L5 20V5.562a2 2 0 0 1 1.515-1.94l4-1A2 2 0 0 1 13 4.561Z" />
              </svg>
            </button>
            <button class="icon-button" type="button" id="settingsButton" title="Настройки" aria-label="Настройки">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z" />
                <circle cx="12" cy="12" r="3" />
              </svg>
            </button>
          </div>
        </div>
      </header>

      <main class="layout mx-auto grid w-full max-w-(--content-max) grid-cols-[minmax(0,1fr)] gap-4 px-4 py-4 md:gap-6 md:px-8 md:py-8 lg:grid-cols-[minmax(0,1fr)_23rem] lg:items-start">
        <section class="calendar-panel" aria-label="Календарь">
          <div class="calendar-toolbar">
            <button class="select-like hidden sm:inline-flex" type="button" id="monthButton">
              <span id="monthLabel">Месяц</span>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6" /></svg>
            </button>
            <div class="month-menu" id="monthMenu" hidden></div>

            <div class="mobile-month">
              <button class="plain-icon" type="button" id="prevWeek" aria-label="Предыдущая неделя">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6" /></svg>
              </button>
              <button class="font-display" type="button" id="mobileMonthTitle">Месяц</button>
              <button class="plain-icon" type="button" id="nextWeek" aria-label="Следующая неделя">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6" /></svg>
              </button>
            </div>

            <div class="hidden gap-1 sm:flex">
              <button class="month-arrow month-arrow-left" type="button" id="prevMonth" aria-label="Предыдущий месяц">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6" /></svg>
              </button>
              <button class="month-arrow month-arrow-right" type="button" id="nextMonth" aria-label="Следующий месяц">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6" /></svg>
              </button>
            </div>
          </div>

          <div class="calendar-wrap">
            <div class="week-strip" id="weekStrip" aria-label="Неделя"></div>
            <div class="calendar-grid" id="calendarGrid" aria-label="Дни месяца"></div>
          </div>
        </section>

        <section class="search-panel" aria-label="Поиск расписания">
          <h2 class="font-display text-xl">Поиск расписания</h2>

          <div class="mode-toggle" role="group" aria-label="Тип расписания">
            <button class="mode-button active" type="button" data-mode="student" aria-pressed="true">Студент</button>
            <button class="mode-button" type="button" data-mode="teacher" aria-pressed="false">Преподаватель</button>
          </div>

          <div class="custom-select" id="entitySelectRoot">
            <button class="select-trigger" type="button" id="entityTrigger" aria-haspopup="listbox" aria-expanded="false">
              <svg class="size-4 shrink-0 text-muted-foreground" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8" /><path d="m21 21-4.3-4.3" /></svg>
              <span class="min-w-0 flex-1 truncate" id="entityTriggerText">Выберите группу</span>
              <span class="trigger-star" id="selectedFavorite" role="button" aria-label="Добавить в избранное">☆</span>
              <svg class="chevron size-4 shrink-0 text-muted-foreground" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6" /></svg>
            </button>
            <div class="select-menu" id="entityMenu" hidden>
              <label class="select-search">
                <svg class="size-4 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8" /><path d="m21 21-4.3-4.3" /></svg>
                <input id="entitySearch" type="search" placeholder="Поиск в списке" autocomplete="off" />
              </label>
              <div class="select-options" id="entityOptions" role="listbox"></div>
            </div>
          </div>

          <div class="grid gap-2">
            <button class="primary-button" type="button" id="showSchedule">Показать расписание</button>
            <button class="secondary-button" type="button" id="downloadSchedule" disabled>Скачать XLSX-таблицу</button>
          </div>
        </section>

        <section class="result-panel hidden" id="resultPanel" aria-live="polite">
          <div class="result-date">
            <strong id="resultDay">--</strong>
            <span id="resultMonth">месяц<br />день</span>
            <strong class="result-entity" id="resultEntity">--</strong>
          </div>
          <div class="lesson-list" id="lessonList"></div>
        </section>
      </main>

      <div class="toast-stack" id="toastStack" aria-live="polite"></div>
    </div>

    <dialog class="modal" id="settingsModal">
      <form method="dialog" class="modal-card">
        <div class="modal-head">
          <h2>Настройки</h2>
          <button class="close-button" value="close" aria-label="Закрыть">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18" /><path d="m6 6 12 12" /></svg>
          </button>
        </div>

        <section class="settings-group">
          <h3>Тема</h3>
          <div class="radio-group" role="radiogroup" aria-label="Тема">
            <label class="radio-card"><input class="sr-only" type="radio" name="theme" data-setting="theme" data-value="light" checked /><span class="radio-indicator" aria-hidden="true"></span>Светлая</label>
            <label class="radio-card"><input class="sr-only" type="radio" name="theme" data-setting="theme" data-value="dark" /><span class="radio-indicator" aria-hidden="true"></span>Тёмная</label>
          </div>
        </section>

        <section class="settings-group">
          <h3>Цвет акцента</h3>
          <div class="color-grid" id="colorGrid"></div>
        </section>

        <section class="settings-group">
          <h3>Размер</h3>
          <div class="radio-group" role="radiogroup" aria-label="Размер">
            <label class="radio-card"><input class="sr-only" type="radio" name="size" data-setting="size" data-value="small" /><span class="radio-indicator" aria-hidden="true"></span>Маленький</label>
            <label class="radio-card"><input class="sr-only" type="radio" name="size" data-setting="size" data-value="medium" checked /><span class="radio-indicator" aria-hidden="true"></span>Средний</label>
            <label class="radio-card"><input class="sr-only" type="radio" name="size" data-setting="size" data-value="large" /><span class="radio-indicator" aria-hidden="true"></span>Большой</label>
          </div>
        </section>

        <section class="settings-group">
          <h3>Ширина содержимого</h3>
          <div class="radio-group" role="radiogroup" aria-label="Ширина содержимого">
            <label class="radio-card"><input class="sr-only" type="radio" name="width" data-setting="width" data-value="compact" /><span class="radio-indicator" aria-hidden="true"></span>Компактно</label>
            <label class="radio-card"><input class="sr-only" type="radio" name="width" data-setting="width" data-value="standard" checked /><span class="radio-indicator" aria-hidden="true"></span>Стандартно</label>
            <label class="radio-card"><input class="sr-only" type="radio" name="width" data-setting="width" data-value="full" /><span class="radio-indicator" aria-hidden="true"></span>Во всю ширину</label>
          </div>
        </section>

        <section class="settings-group">
          <h3>Вывод расписания</h3>
          <div class="radio-group" role="radiogroup" aria-label="Вывод расписания">
            <label class="radio-card"><input class="sr-only" type="radio" name="output" data-setting="output" data-value="bottom" checked /><span class="radio-indicator" aria-hidden="true"></span>Вниз</label>
            <label class="radio-card"><input class="sr-only" type="radio" name="output" data-setting="output" data-value="modal" /><span class="radio-indicator" aria-hidden="true"></span>Модальным окном</label>
          </div>
        </section>
      </form>
    </dialog>

    <dialog class="modal" id="scheduleModal">
      <section class="modal-card schedule-dialog">
        <div class="modal-head">
          <h2 id="modalTitle">Расписание</h2>
          <button class="close-button" type="button" data-close="scheduleModal" aria-label="Закрыть">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18" /><path d="m6 6 12 12" /></svg>
          </button>
        </div>
        <div class="modal-date-line" id="modalDateLine">--</div>
        <div class="lesson-list" id="modalLessonList"></div>
      </section>
    </dialog>

    <dialog class="modal" id="roomsModal">
      <section class="modal-card rooms-card">
        <div class="modal-head">
          <h2>Занятость аудиторий</h2>
          <button class="close-button" type="button" data-close="roomsModal" aria-label="Закрыть">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18" /><path d="m6 6 12 12" /></svg>
          </button>
        </div>

        <div class="segmented building-toggle max-w-md" id="buildingToggle"></div>

        <label class="pair-filter">
          <span>Пара</span>
          <span class="native-select">
            <select id="pairSelect">
              <option value="">Загрузка пар...</option>
            </select>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6" /></svg>
          </span>
        </label>

        <div class="room-cards" id="roomCards"></div>
      </section>
    </dialog>

    <dialog class="modal" id="roomDetailModal">
      <section class="modal-card room-detail-card">
        <div class="modal-head">
          <h2 id="roomDetailTitle">Аудитория</h2>
          <button class="close-button" type="button" data-close="roomDetailModal" aria-label="Закрыть">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18" /><path d="m6 6 12 12" /></svg>
          </button>
        </div>
        <div id="roomDetailContent"></div>
      </section>
    </dialog>

    <dialog class="modal" id="holidayAdminModal">
      <section class="modal-card holiday-admin-card">
        <div class="modal-head">
          <h2>Праздничное оформление</h2>
          <button class="close-button" type="button" data-close="holidayAdminModal" aria-label="Закрыть">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18" /><path d="m6 6 12 12" /></svg>
          </button>
        </div>
        <div class="holiday-options">
          <button type="button" class="holiday-option" data-holiday="auto">Авто по дате</button>
          <button type="button" class="holiday-option" data-holiday="none">Без оформления</button>
          <button type="button" class="holiday-option" data-holiday="new-year">Новый год</button>
          <button type="button" class="holiday-option" data-holiday="russia-day">День России</button>
          <button type="button" class="holiday-option" data-holiday="easter">Пасха</button>
          <button type="button" class="holiday-option" data-holiday="september">1 сентября</button>
          <button type="button" class="holiday-option" data-holiday="march-8">8 марта</button>
          <button type="button" class="holiday-option" data-holiday="february-23">23 февраля</button>
          <button type="button" class="holiday-option" data-holiday="victory-day">9 мая</button>
        </div>
      </section>
    </dialog>

    <script src="js/modules/config.js"></script>
    <script src="js/modules/data.js"></script>
    <script src="js/modules/storage.js"></script>
    <script src="js/modules/error-catalog.js"></script>
    <script src="js/modules/holiday.js"></script>
    <script src="js/modules/api-client.js"></script>
    <script src="js/modules/public-api.js"></script>
    <script src="js/modules/schedule-request.js"></script>
    <script src="js/modules/schedule-time-store.js"></script>
    <script src="js/modules/schedule-transform.js"></script>
    <script src="js/modules/schedule-service.js"></script>
    <script src="js/modules/holiday-particles.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
