<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Расписание НТТЭК</title>
    <link rel="icon" type="image/svg+xml" href="Img/Favicon.svg" />
    <link rel="stylesheet" href="css/main.css" />
    <link rel="stylesheet" href="css/holidays/new-year.css" />
    <link rel="stylesheet" href="css/holidays/russia-day.css" />
    <link rel="stylesheet" href="css/holidays/easter.css" />
    <link rel="stylesheet" href="css/holidays/tagil-day.css" />
    <link rel="stylesheet" href="css/holidays/september.css" />
    <link rel="stylesheet" href="css/holidays/march-8.css" />
    <link rel="stylesheet" href="css/holidays/february-23.css" />
    <link rel="stylesheet" href="css/holidays/victory-day.css" />
    <link rel="stylesheet" href="css/holidays/holiday-numbers.css" />
    <link rel="stylesheet" href="css/holidays/holiday-buttons.css" />
  </head>
  <body>
    <div class="app" data-theme="light" data-size="medium">
      <div class="holiday-layer" aria-hidden="true">
        <canvas class="holiday-particles" id="holidayParticles"></canvas>
        <div class="garland"></div>
        <div class="snowfall"></div>
        <div class="flag-wave"></div>
        <div class="holiday-ribbon"></div>
        <div class="holiday-number">
          <span class="number-halo"></span>
          <span class="number-decor number-decor-1"></span>
          <span class="number-decor number-decor-2"></span>
          <span class="number-decor number-decor-3"></span>
          <span class="number-decor number-decor-4"></span>
        </div>
      </div>
      <button class="admin-holiday-button" type="button" id="holidayAdminButton" aria-label="Тест праздничного оформления"></button>

      <header class="app-header">
        <a class="brand" href="#" title="Расписание НТТЭК" aria-label="Главная страница расписания">
          <img class="logo" src="Img/Logo_Nttek.svg" alt="НТТЭК" />
          <strong>Расписание<br class="mobile-break" /> ГАПОУ СО НТТЭК</strong>
        </a>

        <div class="header-actions" aria-label="Быстрые действия">
          <button class="icon-button" type="button" id="roomsButton" title="Занятость аудиторий" aria-label="Занятость аудиторий">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M13 4h3a2 2 0 0 1 2 2v14" />
              <path d="M2 20h3" />
              <path d="M13 20h9" />
              <path d="M10 12v.01" />
              <path d="M13 4.562v16.157a1 1 0 0 1-1.242.97L5 20V5.562a2 2 0 0 1 1.515-1.94l4-1A2 2 0 0 1 13 4.561Z" />
            </svg>
          </button>
          <button class="icon-button" type="button" id="settingsButton" title="Настройки" aria-label="Настройки">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z" />
              <circle cx="12" cy="12" r="3" />
            </svg>
          </button>
        </div>
      </header>

      <main class="layout">
        <section class="calendar-panel" aria-label="Календарь">
          <div class="calendar-toolbar">
            <button class="select-like" type="button" id="monthButton">
              <span id="monthLabel">Месяц</span>
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6" /></svg>
            </button>
            <div class="month-menu" id="monthMenu" hidden></div>
            <div class="mobile-month">
              <button class="plain-icon" type="button" id="prevWeek" aria-label="Предыдущая неделя">‹</button>
              <strong id="mobileMonthTitle">Месяц</strong>
              <button class="plain-icon" type="button" id="nextWeek" aria-label="Следующая неделя">›</button>
            </div>
          </div>

          <div class="calendar-wrap">
            <button class="month-arrow month-arrow-left" type="button" id="prevMonth" aria-label="Предыдущий месяц">‹</button>
            <div>
              <div class="week-strip" id="weekStrip" aria-label="Неделя"></div>
              <div class="calendar-grid" id="calendarGrid" aria-label="Дни месяца"></div>
            </div>
            <button class="month-arrow month-arrow-right" type="button" id="nextMonth" aria-label="Следующий месяц">›</button>
          </div>
        </section>

        <section class="search-panel" aria-label="Поиск расписания">
          <div class="mode-toggle" role="group" aria-label="Тип расписания">
            <button class="mode-button active" type="button" data-mode="student">Студент</button>
            <button class="mode-button" type="button" data-mode="teacher">Преподаватель</button>
          </div>

          <div class="custom-select" id="entitySelectRoot">
            <button class="select-trigger" type="button" id="entityTrigger" aria-expanded="false">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10.8 18.1a7.3 7.3 0 1 1 0-14.6 7.3 7.3 0 0 1 0 14.6Zm5.2-1.5 4 4" /></svg>
              <span id="entityTriggerText">Выберите группу</span>
              <span class="trigger-star" id="selectedFavorite">☆</span>
              <svg class="chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6" /></svg>
            </button>
            <div class="select-menu" id="entityMenu" hidden>
              <label class="select-search">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10.8 18.1a7.3 7.3 0 1 1 0-14.6 7.3 7.3 0 0 1 0 14.6Zm5.2-1.5 4 4" /></svg>
                <input id="entitySearch" type="search" placeholder="Поиск в списке" autocomplete="off" />
              </label>
              <div class="select-options" id="entityOptions"></div>
            </div>
          </div>

          <button class="primary-button" type="button" id="showSchedule">Показать расписание</button>
          <button class="secondary-button" type="button">Скачать таблицу ХДЧЫ</button>
        </section>

        <section class="result-panel hidden" id="resultPanel" aria-live="polite">
          <div class="result-date">
            <strong id="resultDay">--</strong>
            <span id="resultMonth">месяц<br />день</span>
          </div>
          <div class="lesson-list detailed" id="lessonList"></div>
        </section>
      </main>

      <div class="toast-stack" id="toastStack" aria-live="polite"></div>
    </div>

    <dialog class="modal" id="settingsModal">
      <form method="dialog" class="modal-card">
        <div class="modal-head">
          <h2>Настройки</h2>
          <button class="close-button" value="close" aria-label="Закрыть">×</button>
        </div>

        <section class="settings-group">
          <h3>Тема</h3>
          <div class="segmented">
            <button type="button" class="setting-pill active" data-setting="theme" data-value="light">Светлая</button>
            <button type="button" class="setting-pill" data-setting="theme" data-value="dark">Темная</button>
          </div>
        </section>

        <section class="settings-group">
          <h3>Цвет акцента</h3>
          <div class="color-grid" id="colorGrid"></div>
        </section>

        <section class="settings-group">
          <h3>Размер</h3>
          <div class="segmented">
            <button type="button" class="setting-pill" data-setting="size" data-value="small">Маленький</button>
            <button type="button" class="setting-pill active" data-setting="size" data-value="medium">Средний</button>
            <button type="button" class="setting-pill" data-setting="size" data-value="large">Большой</button>
          </div>
        </section>

        <section class="settings-group">
          <h3>Вывод расписания</h3>
          <div class="segmented">
            <button type="button" class="setting-pill active" data-setting="output" data-value="bottom">Вниз</button>
            <button type="button" class="setting-pill" data-setting="output" data-value="modal">Модальным окном</button>
          </div>
        </section>
      </form>
    </dialog>

    <dialog class="modal" id="scheduleModal">
      <section class="modal-card schedule-dialog">
        <div class="modal-head">
          <h2 id="modalTitle">Расписание</h2>
          <button class="close-button" type="button" data-close="scheduleModal" aria-label="Закрыть">×</button>
        </div>
        <div class="modal-date-line" id="modalDateLine">--</div>
        <div class="lesson-list detailed" id="modalLessonList"></div>
      </section>
    </dialog>

    <dialog class="modal" id="roomsModal">
      <section class="modal-card rooms-card">
        <div class="modal-head">
          <h2>Занятость аудиторий</h2>
          <button class="close-button" type="button" data-close="roomsModal" aria-label="Закрыть">×</button>
        </div>

        <div class="segmented building-toggle">
          <button type="button" class="setting-pill active" data-building="1">1 корпус</button>
          <button type="button" class="setting-pill" data-building="2">2 корпус</button>
        </div>

        <label class="pair-filter">
          <span>Пара</span>
          <select id="pairSelect">
            <option value="1">1 пара (1-2 урок)</option>
            <option value="2">2 пара (3-4 урок)</option>
            <option value="3">5 урок</option>
            <option value="4">3 пара (6-7 урок)</option>
          </select>
        </label>

        <div class="room-cards" id="roomCards"></div>
      </section>
    </dialog>

    <dialog class="modal" id="roomDetailModal">
      <section class="modal-card room-detail-card">
        <div class="modal-head">
          <h2 id="roomDetailTitle">Аудитория</h2>
          <button class="close-button" type="button" data-close="roomDetailModal" aria-label="Закрыть">×</button>
        </div>
        <div id="roomDetailContent"></div>
      </section>
    </dialog>

    <dialog class="modal" id="holidayAdminModal">
      <section class="modal-card holiday-admin-card">
        <div class="modal-head">
          <h2>Праздничное оформление</h2>
          <button class="close-button" type="button" data-close="holidayAdminModal" aria-label="Закрыть">×</button>
        </div>
        <div class="holiday-options">
          <button type="button" class="holiday-option" data-holiday="auto">Авто по дате</button>
          <button type="button" class="holiday-option" data-holiday="none">Без оформления</button>
          <button type="button" class="holiday-option" data-holiday="new-year">Новый год</button>
          <button type="button" class="holiday-option" data-holiday="russia-day">День России</button>
          <button type="button" class="holiday-option" data-holiday="easter">Пасха</button>
          <button type="button" class="holiday-option" data-holiday="tagil-day">День Нижнего Тагила</button>
          <button type="button" class="holiday-option" data-holiday="september">1 сентября</button>
          <button type="button" class="holiday-option" data-holiday="march-8">8 марта</button>
          <button type="button" class="holiday-option" data-holiday="february-23">23 февраля</button>
          <button type="button" class="holiday-option" data-holiday="victory-day">9 мая</button>
        </div>
      </section>
    </dialog>

    <script src="js/modules/data.js"></script>
    <script src="js/modules/storage.js"></script>
    <script src="js/modules/holiday.js"></script>
    <script src="js/modules/api-client.js"></script>
    <script src="js/modules/public-api.js"></script>
    <script src="js/modules/schedule-request.js"></script>
    <script src="js/modules/schedule-transform.js"></script>
    <script src="js/modules/schedule-service.js"></script>
    <script src="js/modules/holiday-particles.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
